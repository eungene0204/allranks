name: SEO response checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/seo-snapshots.test.mts
      - run: npm run build
      - name: Check production HTML locally
        run: |
          npx next start -p 3200 > /tmp/allranks-seo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3200/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          npm run seo:check -- http://localhost:3200
