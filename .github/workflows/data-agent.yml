# Manual discovery run. Daily local collection, verification, and deployment use the
# allranks-daily-local-deploy skill and its macOS LaunchAgent.
name: Data agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | discover | refresh | run"
        default: "discover"
      extra:
        description: "Extra CLI options, e.g. --category energy --max-new 2"
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Continue pending data additions
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/agent/data-update; then
            git switch --create data-agent-work origin/agent/data-update
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check API credentials
        if: inputs.mode != 'plan'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret before running daily ranking discovery."
            exit 1
          fi
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode || 'discover' }}
          EXTRA: ${{ inputs.extra }}
        # The pipelines inside "refresh"/"run" may fail on a single source; the agent run itself must still finish.
        run: npm run agent -- "$MODE" --max-new 3 --focus "Prioritize the latest available official data; check existing rankings to avoid duplicates and state the actual reference year." $EXTRA
      - name: Validate
        run: npm run data:validate && npm run lint
      - uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: agent/data-update
          delete-branch: true
          commit-message: "data: daily ranking additions"
          title: "data: daily ranking additions"
          body-path: data/agent/last-run.md
          labels: data, ai-generated
