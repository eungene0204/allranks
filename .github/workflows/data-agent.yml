# Periodic data run: refresh the automatic pipelines, let the AI agent update hand-entered rankings and add new ones,
# then open a pull request for a human to review. Nothing reaches main without that review.
# Setup: add the repository secret ANTHROPIC_API_KEY and allow Actions to create pull requests
# (Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests").
name: Data agent

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | discover | refresh | run"
        default: "run"
      extra:
        description: "Extra CLI options, e.g. --category energy --max-new 2"
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode || 'run' }}
          EXTRA: ${{ inputs.extra }}
        # The pipelines inside "refresh"/"run" may fail on a single source; the agent run itself must still finish.
        run: npm run agent -- "$MODE" $EXTRA
      - name: Validate
        run: npm run data:validate && npm run lint
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/data-update
          delete-branch: true
          commit-message: "data: weekly agent update"
          title: "data: weekly agent update"
          body-path: data/agent/last-run.md
          labels: data, ai-generated
